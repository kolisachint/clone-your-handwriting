[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handfont"
version = "0.1.0"
description = "Turn a scanned handwriting sheet into your own font (TTF, OTF, WOFF2 + CSS)."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "potracer>=0.0.4",
  "fonttools[woff]>=4.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
handfont = "handfont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
